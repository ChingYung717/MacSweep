name: macOS Build & Checks

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, Test & Package (macOS arm64)
    runs-on: macos-15
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Record runner toolchain versions
        run: |
          sw_vers
          uname -m
          xcodebuild -version
          swift --version

      - name: Build and run sandbox & regression checks
        timeout-minutes: 10
        run: |
          swift build
          swift run MacSweepChecks
          swift run MacSweepChecks --live-audit

      - name: Package standalone MacSweep.app
        timeout-minutes: 10
        env:
          MACSWEEP_SIGN_IDENTITY: "-"
        run: ./make_app.sh

      - name: Verify package
        timeout-minutes: 5
        run: |
          app=dist/MacSweep.app
          test "$(lipo -archs "$app/Contents/MacOS/MacSweepApp")" = arm64
          otool -L "$app/Contents/MacOS/MacSweepApp" > "$RUNNER_TEMP/macsweep-dylibs.txt"
          if grep -E '/opt/homebrew|/usr/local' "$RUNNER_TEMP/macsweep-dylibs.txt"; then
            exit 1
          fi
          codesign --verify --deep --strict "$app"
          unzip -tq dist/MacSweep-arm64.zip
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")
          [[ "$version" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]
          minimum=$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$app/Contents/Info.plist")
          [[ "$minimum" =~ ^[0-9]+(\.[0-9]+){1,2}$ ]]
          cd dist
          printf 'Version: %s\nCommit: %s\nArchitecture: arm64 (Apple Silicon)\nMinimum macOS: %s\nSignature: ad hoc, not notarized\nSwift: %s\n' \
            "$version" "$GITHUB_SHA" "$minimum" "$(swift --version | head -n 1)" > build-info.txt
          shasum -a 256 MacSweep-arm64.zip build-info.txt > SHA256SUMS

      - name: Upload verified preview assets
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: MacSweep-arm64
          path: |
            dist/MacSweep-arm64.zip
            dist/SHA256SUMS
            dist/build-info.txt
          if-no-files-found: error

  publish-preview:
    name: Publish preview on GitHub Releases
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.sha }}
      cancel-in-progress: false

    steps:
      - name: Checkout release script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Download the verified macOS package
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: MacSweep-arm64

      - name: Publish the package for this commit
        timeout-minutes: 5
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash scripts/publish_preview.sh
